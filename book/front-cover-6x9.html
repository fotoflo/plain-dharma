<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plain Dharma — front cover (6×9 · ebook/Kindle base)</title>
<style>
  /* 6×9 sibling of book/front-cover.html (the 5×8 print front). Same A design,
     retargeted to a 6×9 trim — feeds cover.jpg (EPUB interior + PDF cover page)
     and, cream-padded to 1.6:1, cover-kindle.jpg. No bleed: this face isn't
     composited into a wraparound, it's a standalone cover image. */
  @font-face {
    font-family: "Garamond Libre";
    src: url("fonts/GaramondLibre-Regular.otf") format("opentype");
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Garamond Libre";
    src: url("fonts/GaramondLibre-Italic.otf") format("opentype");
    font-weight: 400; font-style: italic; font-display: swap;
  }
  @font-face {
    font-family: "Garamond Libre";
    src: url("fonts/GaramondLibre-Bold.otf") format("opentype");
    font-weight: 700; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Geist";
    src: url("fonts/Geist-Variable.woff2") format("woff2-variations");
    font-weight: 100 900; font-style: normal; font-display: swap;
  }

  :root {
    --cover-paper:  #F9F1DC;
    --cover-band:   #FBC608;
    --cover-ink:    #1F1812;
    --cover-stitch: #8B3A0F;
    --cover-thread: #E01B0E;
    --cover-mute:   rgba(31, 24, 18, 0.62);
    --cover-faint:  rgba(31, 24, 18, 0.42);
  }

  html, body { background: #2a2a2a; margin: 0; padding: 0; }

  /* 6" × 9" trim @ ~267dpi (1600 × 2400 px), ratio 0.667. */
  .cover {
    position: relative;
    width: 1600px;
    height: 2400px;
    background: var(--cover-paper);
    color: var(--cover-ink);
    font-family: "Garamond Libre", Georgia, serif;
    overflow: hidden;
    margin: 24px auto;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
  }

  .band {
    position: absolute;
    top: 0; bottom: 0; left: 0;
    width: 114px;
    background: var(--cover-band);
  }
  .stitch {
    position: absolute;
    top: 0; bottom: 0;
    left: 98px;
    width: 2px;
    background-image: linear-gradient(
      to bottom,
      var(--cover-thread) 0px,
      var(--cover-thread) 12px,
      transparent 12px,
      transparent 26px
    );
    background-size: 100% 26px;
    background-repeat: repeat-y;
  }

  .col {
    position: absolute;
    top: 0; bottom: 0;
    left: 200px;
    right: 200px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .masthead { margin-top: 200px; }
  .eyebrow {
    font-family: "Geist", system-ui, sans-serif;
    font-size: 25px;
    font-weight: 500;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--cover-stitch);
    margin: 0;
  }
  .rule {
    height: 2px;
    width: 132px;
    background: var(--cover-stitch);
    opacity: 0.6;
    margin: 36px auto 0;
  }

  .title {
    margin: 64px 0 0;
    font-size: 232px;
    font-weight: 400;
    line-height: 0.92;
    letter-spacing: -0.022em;
    color: var(--cover-ink);
  }
  .title .l2 { display: block; }

  .subtitle {
    margin: 52px auto 0;
    font-style: italic;
    font-size: 60px;
    line-height: 1.28;
    letter-spacing: -0.005em;
    color: var(--cover-mute);
    max-width: 920px;
  }

  .scene {
    position: relative;
    margin-top: auto;
    margin-bottom: auto;
    width: 100%;
    display: flex;
    justify-content: center;
  }
  .scene img {
    position: relative;
    width: 1080px;
    height: auto;
    display: block;
  }

  .byline { margin-bottom: 240px; }
  .author {
    font-size: 58px;
    font-weight: 400;
    line-height: 1.32;
    letter-spacing: -0.005em;
    color: var(--cover-mute);
    margin: 0;
  }
  .author .name { color: var(--cover-ink); }
  .credit {
    margin-top: 38px;
    font-family: "Geist", system-ui, sans-serif;
    font-size: 22px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--cover-faint);
  }
  .credit b {
    color: var(--cover-stitch);
    font-weight: 600;
  }
</style>
</head>
<body>

<article class="cover">
  <div class="band" aria-hidden="true"></div>
  <div class="stitch" aria-hidden="true"></div>

  <div class="col">
    <div class="masthead">
      <p class="eyebrow">Six Foundational Teachings</p>
      <div class="rule"></div>
    </div>

    <h1 class="title">Plain<span class="l2">Dharma</span></h1>

    <p class="subtitle">The Buddha&rsquo;s Foundational Teachings<br>in Modern English</p>

    <div class="scene">
      <img src="assets/cover-sun.png" alt="A watercolor sun rising over a still horizon.">
    </div>

    <div class="byline">
      <p class="author">Translated by <span class="name">Claude Opus</span></p>
      <p class="author">Edited by <span class="name">Alex Miller</span></p>
      <p class="credit"><b>A dharma gift</b> &nbsp;·&nbsp; plaindharma.com</p>
    </div>
  </div>
</article>

</body>
</html>
