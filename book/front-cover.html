<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plain Dharma — front cover</title>
<style>
  /* ── Fonts (local copies; see book/fonts/) ────────────────────
     Garamond Libre is the body serif used site-wide (src/app/fonts);
     Geist is the UI sans (npm `geist`). Both are copied into book/fonts
     so this cover renders standalone — no build step, no network. */
  @font-face {
    font-family: "Garamond Libre";
    src: url("fonts/GaramondLibre-Regular.otf") format("opentype");
    font-weight: 400; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Garamond Libre";
    src: url("fonts/GaramondLibre-Italic.otf") format("opentype");
    font-weight: 400; font-style: italic; font-display: swap;
  }
  @font-face {
    font-family: "Garamond Libre";
    src: url("fonts/GaramondLibre-Bold.otf") format("opentype");
    font-weight: 700; font-style: normal; font-display: swap;
  }
  @font-face {
    font-family: "Geist";
    src: url("fonts/Geist-Variable.woff2") format("woff2-variations");
    font-weight: 100 900; font-style: normal; font-display: swap;
  }

  /* Sampled from the cover artwork — paper runs a touch warmer than the
     screen --color-bg (#F5EFE0); keep front and back aligned for print. */
  :root {
    --cover-paper:  #F9F1DC;
    --cover-band:   #FBC608;
    --cover-ink:    #1F1812;
    --cover-stitch: #8B3A0F;   /* rust */
    --cover-thread: #C8331A;   /* brighter red thread — reads on the gold band */
    --cover-mute:   rgba(31, 24, 18, 0.62);
    --cover-faint:  rgba(31, 24, 18, 0.42);
  }

  html, body { background: #2a2a2a; margin: 0; padding: 0; }

  /* 6" × 9" trim @ 200dpi (1600 × 2400 px), identical grid to the back
     cover so a printer can lay the spread out without scaling drift. */
  .cover {
    position: relative;
    width: 1600px;
    height: 2400px;
    background: var(--cover-paper);
    color: var(--cover-ink);
    font-family: "Garamond Libre", Georgia, serif;
    overflow: hidden;
    margin: 24px auto;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
  }

  /* Spine-side furniture — band + stitch on the LEFT, mirroring the back. */
  .band {
    position: absolute;
    top: 0; bottom: 0; left: 0;
    width: 114px;
    background: var(--cover-band);
  }
  /* Stitch runs ON the gold band — inset ~16px from its right edge — so it
     reads as thread sewn through the binding rather than floating in cream. */
  .stitch {
    position: absolute;
    top: 0; bottom: 0;
    left: 98px;
    width: 2px;
    background-image: linear-gradient(
      to bottom,
      var(--cover-thread) 0px,
      var(--cover-thread) 12px,
      transparent 12px,
      transparent 26px
    );
    background-size: 100% 26px;
    background-repeat: repeat-y;
  }

  /* Type column — clear of the spine furniture, centered within. */
  .col {
    position: absolute;
    top: 0; bottom: 0;
    left: 230px;
    right: 150px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  /* ── Masthead ─────────────────────────────────────────────── */
  .masthead { margin-top: 250px; }
  .eyebrow {
    font-family: "Geist", system-ui, sans-serif;
    font-size: 25px;
    font-weight: 500;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: var(--cover-stitch);
    margin: 0;
  }
  .rule {
    height: 2px;
    width: 132px;
    background: var(--cover-stitch);
    opacity: 0.6;
    margin: 36px auto 0;
  }

  .title {
    margin: 64px 0 0;
    font-size: 232px;
    font-weight: 400;
    line-height: 0.92;
    letter-spacing: -0.022em;
    color: var(--cover-ink);
  }
  .title .l2 { display: block; }

  .subtitle {
    margin: 52px auto 0;
    font-style: italic;
    font-size: 60px;
    line-height: 1.28;
    letter-spacing: -0.005em;
    color: var(--cover-mute);
    max-width: 920px;
  }

  /* ── Hero sun — the focal point, set just below the subtitle ── */
  .scene {
    position: relative;
    margin-top: 90px;     /* fixed gap under subtitle — keeps the sun high  */
    margin-bottom: auto;  /* leftover space falls below, above the byline   */
    width: 100%;
    display: flex;
    justify-content: center;
  }
  .scene img {
    position: relative;
    width: 1080px;
    height: auto;
    display: block;
  }

  /* ── Byline ───────────────────────────────────────────────── */
  .byline { margin-bottom: 230px; }
  .author {
    font-size: 58px;
    font-weight: 400;
    line-height: 1.32;
    letter-spacing: -0.005em;
    color: var(--cover-mute);
    margin: 0;
  }
  .author .name { color: var(--cover-ink); }
  .credit {
    margin-top: 38px;
    font-family: "Geist", system-ui, sans-serif;
    font-size: 22px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--cover-faint);
  }
  .credit b {
    color: var(--cover-stitch);
    font-weight: 600;
  }

  /* Print — flatten the dark stage, exact color, true trim. */
  @media print {
    @page { size: 6in 9in; margin: 0; }
    html, body { background: #fff; }
    .cover {
      margin: 0;
      box-shadow: none;
      width: 6in;
      height: 9in;
    }
    .band { width: 0.4275in; }
    .stitch { left: 0.3675in; }
    .col { left: 0.8625in; right: 0.5625in; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<article class="cover">
  <div class="band" aria-hidden="true"></div>
  <div class="stitch" aria-hidden="true"></div>

  <div class="col">
    <div class="masthead">
      <p class="eyebrow">Six Foundational Teachings</p>
      <div class="rule"></div>
    </div>

    <h1 class="title">Plain<span class="l2">Dharma</span></h1>

    <p class="subtitle">The Buddha&rsquo;s Foundational Teachings<br>in Modern English</p>

    <div class="scene">
      <img src="assets/cover-sun.png" alt="A watercolor sun rising over a still horizon.">
    </div>

    <div class="byline">
      <p class="author">Translated by <span class="name">Claude</span></p>
      <p class="author">Edited by <span class="name">Alex Miller</span></p>
      <p class="credit"><b>A dharma gift</b> &nbsp;·&nbsp; plaindharma.com</p>
    </div>
  </div>
</article>

</body>
</html>
